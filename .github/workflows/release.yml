# Opens a release PR from merged commits. Merging it tags vX.Y.Z, then moves v<major>.
name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  release-please:
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Prepare releases with Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Move the major tag to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git tag -f "v${MAJOR}" "${SHA}"
          git push -f origin "refs/tags/v${MAJOR}"
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
