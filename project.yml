# XcodeGen spec for the package's own test hosts: one iOS app and one macOS app, each
# running a hosted test bundle that depends on the package (docs/architecture/02-containers.md).
# Run: make generate. The generated UITestingLibrary.xcodeproj is ignored, never hand-edited.
name: UITestingLibrary
options:
  bundleIdPrefix: org.may-journal.ui-testing-library
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    # Local hosts only: the macOS targets sign ad hoc, which needs no team. The iOS targets
    # run on this Mac as Designed for iPad, and the iOS 27 SDK refuses ad-hoc signing, so
    # they use a development team (see targets below).
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''

packages:
  UITestingLibrary:
    path: .

targetTemplates:
  # Shared by both hosts: one SwiftUI source folder and a generated Info.plist.
  Host:
    type: application
    sources:
      - path: TestHost
    settings:
      base:
        # One module name, so both bundles write `@testable import TestHost`.
        PRODUCT_MODULE_NAME: TestHost
        GENERATE_INFOPLIST_FILE: YES
        # Installing as Designed for iPad requires both version keys.
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '1.0'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  # Shared by both bundles: the package, and a generated Info.plist.
  HostedTests:
    type: bundle.unit-test
    dependencies:
      - package: UITestingLibrary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

targets:
  TestHost:
    templates: [Host]
    platform: iOS
    settings:
      base: &iosSigning
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: AMPJZXR538
  TestHostMac:
    templates: [Host]
    platform: macOS
  UITestingLibraryTests:
    templates: [HostedTests]
    platform: iOS
    settings:
      base: *iosSigning
    sources:
      - path: Tests/Shared
      - path: Tests/UITestingLibraryTests
    dependencies:
      - target: TestHost
  UITestingLibraryTestsMac:
    templates: [HostedTests]
    platform: macOS
    sources:
      - path: Tests/Shared
      - path: Tests/UITestingLibraryMacTests
    dependencies:
      - target: TestHostMac

schemes:
  TestHost:
    build:
      targets:
        TestHost: all
        UITestingLibraryTests: [test]
    test:
      targets:
        - UITestingLibraryTests
  TestHostMac:
    build:
      targets:
        TestHostMac: all
        UITestingLibraryTestsMac: [test]
    test:
      targets:
        - UITestingLibraryTestsMac
