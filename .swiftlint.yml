# SwiftLint, run by the fitness `swiftlint` check as `swiftlint lint --strict`.
# Lines wrap with `make format`, which runs swift-format with .swift-format.
# Thresholds: complexity 5, file and type length 200, function body 40, line length 100.

included:
  - Sources
  - TestHost
  - Tests

excluded:
  - .build

cyclomatic_complexity:
  warning: 5
  error: 5

file_length:
  warning: 200
  error: 200

function_body_length:
  warning: 40
  error: 50

function_parameter_count:
  warning: 5
  error: 5

type_body_length:
  warning: 200
  error: 200

line_length:
  warning: 100
  error: 100
  ignores_urls: true

vertical_whitespace:
  max_empty_lines: 1

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - modifier_order
  - redundant_nil_coalescing
  - toggle_bool

# swift-format puts a long declaration's brace on its own line.
disabled_rules:
  - trailing_comma
  - opening_brace

identifier_name:
  min_length:
    warning: 2
    error: 2

force_try: error
force_cast: error
